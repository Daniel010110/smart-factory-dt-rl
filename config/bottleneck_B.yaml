simulation:
  scenario_name: bottleneck_B
  max_steps: 100
  seed: 42
  random_seed: 42
  seeds: [42, 43, 44]
  job_interval: 5
  job_arrival_probability: 0.2
  max_jobs: 10

job_generation:
  mode: probability
  arrival_probability: 0.2
  arrival_interval: 5

processes:
  ProcessA:
    processing_time: 3
  ProcessB:
    processing_time: 10
  ProcessC:
    processing_time: 3

agv:
  num_agvs: 2
  speed: 1.0
  start_location: Input

metrics:
  bottleneck_queue_threshold: 3

factory:
  agv_count: 2
  travel_time_per_unit: 1
  processing_times:
    ProcessA: 3
    ProcessB: 10
    ProcessC: 3

layout:
  locations:
    Input: [0, 0]
    ProcessA: [2, 0]
    ProcessB: [4, 0]
    ProcessC: [6, 0]
    Output: [8, 0]

logging:
  output_path: data/logs/bottleneck_B_simulation_log.csv
